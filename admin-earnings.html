<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoinBuddy - Earnings & Payouts</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5fb;color:#20243a}
header{background:#171b3b;color:white;padding:20px}
main{padding:20px;max-width:1100px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button{background:#5546d9;color:white;border:0;padding:10px 15px;border-radius:8px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:15px}
.stat,.card{background:white;padding:18px;border-radius:14px;box-shadow:0 3px 15px #00000010;margin-top:18px}
.stat{margin-top:0;background:#f1f0ff}
.stat small{color:#666}
.stat h2{margin:8px 0 0;font-size:24px}
.table-wrap{overflow-x:auto;margin-top:15px}
table{width:100%;border-collapse:collapse;min-width:750px}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
th{background:#f1f0ff}
.paid{color:green;font-weight:bold}
.pending{color:#b36b00;font-weight:bold}
#message{color:#666;padding:18px 0}
</style>
</head>
<body>

<header>
<h2>JoinBuddy Earnings & Payouts</h2>
<p>Partner Payment Management</p>
</header>

<main>
<div class="top">
<h2>Earnings Dashboard</h2>
<button onclick="loadEarnings()">Refresh</button>
</div>

<div class="stats">
<div class="stat">
<small>Total Earnings</small>
<h2 id="totalEarnings">₹0</h2>
</div>
<div class="stat">
<small>Pending Payment</small>
<h2 id="pendingAmount">₹0</h2>
</div>
<div class="stat">
<small>Paid Amount</small>
<h2 id="paidAmount">₹0</h2>
</div>
<div class="stat">
<small>Total Records</small>
<h2 id="totalRecords">0</h2>
</div>
</div>

<div class="card">
<h3>Partner-wise Earnings & Payouts</h3>
<div id="message">Loading earnings...</div>
<div class="table-wrap">
<table id="earningTable" style="display:none">
<thead>
<tr>
<th>Partner</th>
<th>Amount</th>
<th>Description</th>
<th>Payment Status</th>
<th>Created At</th>
<th>Action</th>
</tr>
</thead>
<tbody id="earningBody"></tbody>
</table>
</div>
</div>

<button style="margin-top:20px" onclick="location.href='admin-panel.html'">
Back to Dashboard
</button>
</main>

<script>
const client = window.supabaseClient;
let earningsData = [];
let partnerNames = {};

async function initialize(){
  if(!client){
    document.getElementById("message").textContent =
      "Supabase connection not found.";
    return;
  }

  const {data:{user},error} = await client.auth.getUser();

  if(error || !user){
    location.href = "admin-panel.html";
    return;
  }

  const {data:profile,error:profileError} = await client
    .from("partner_profiles")
    .select("role,status")
    .eq("id",user.id)
    .single();

  if(profileError || !profile ||
     profile.role !== "admin" ||
     profile.status !== "approved"){
    alert("Admin access required");
    location.href = "admin-panel.html";
    return;
  }

  loadEarnings();
}

function money(value){
  return "₹" + Number(value || 0).toLocaleString("en-IN");
}

async function loadEarnings(){
  const message = document.getElementById("message");
  const table = document.getElementById("earningTable");
  const body = document.getElementById("earningBody");

  message.textContent = "Loading earnings...";
  table.style.display = "none";
  body.replaceChildren();

  const [earningsResult,partnersResult] = await Promise.all([
    client.from("earnings").select("*").limit(1000),
    client.from("partner_profiles")
      .select("id,full_name")
      .eq("role","partner")
  ]);

  if(earningsResult.error){
    message.textContent =
      "Earnings error: " + earningsResult.error.message;
    return;
  }

  if(partnersResult.error){
    message.textContent =
      "Partners error: " + partnersResult.error.message;
    return;
  }

  earningsData = earningsResult.data || [];
  partnerNames = {};

  (partnersResult.data || []).forEach(p=>{
    partnerNames[p.id] = p.full_name || "Unnamed Partner";
  });

  let total = 0;
  let pending = 0;
  let paid = 0;

  earningsData.forEach(item=>{
    const amount = Number(item.amount || 0);
    const status = String(item.payment_status || "pending").toLowerCase();

    total += amount;
    if(status === "paid") paid += amount;
    else pending += amount;
  });

  document.getElementById("totalEarnings").textContent = money(total);
  document.getElementById("pendingAmount").textContent = money(pending);
  document.getElementById("paidAmount").textContent = money(paid);
  document.getElementById("totalRecords").textContent = earningsData.length;

  if(earningsData.length === 0){
    message.textContent = "Abhi koi earning record nahi hai.";
    return;
  }

  earningsData.forEach(item=>{
    const tr = document.createElement("tr");
    const status = String(item.payment_status || "pending").toLowerCase();
    const isPaid = status === "paid";

    const values = [
      partnerNames[item.partner_user_id] || "Partner",
      money(item.amount),
      item.description || "-",
      isPaid ? "PAID" : (item.payment_status || "PENDING").toUpperCase(),
      item.created_at ? new Date(item.created_at).toLocaleString("en-IN") : "-"
    ];

    values.forEach((value,index)=>{
      const td = document.createElement("td");
      td.textContent = value;
      if(index === 3) td.className = isPaid ? "paid" : "pending";
      tr.appendChild(td);
    });

    const actionCell = document.createElement("td");
    const btn = document.createElement("button");

    btn.textContent = isPaid ? "Paid" : "Mark as Paid";
    btn.disabled = isPaid;
    btn.onclick = ()=>markAsPaid(item.id,btn);

    actionCell.appendChild(btn);
    tr.appendChild(actionCell);
    body.appendChild(tr);
  });

  message.textContent = "Total Earning Records: " + earningsData.length;
  table.style.display = "table";
}

async function markAsPaid(id,button){
  if(!confirm("Kya aap is payment ko Paid mark karna chahte hain?")) return;

  button.disabled = true;
  button.textContent = "Updating...";

  const {error} = await client
    .from("earnings")
    .update({payment_status:"paid"})
    .eq("id",id);

  if(error){
    alert("Payment update nahi hua: " + error.message);
    button.disabled = false;
    button.textContent = "Mark as Paid";
    return;
  }

  alert("Payment status updated successfully.");
  loadEarnings();
}

initialize();
</script>
</body>
</html>
