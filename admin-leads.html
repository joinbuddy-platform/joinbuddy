
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoinBuddy Admin Leads</title>

<style>
*{box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#f2f5fa;
  margin:0;
  color:#222;
}
header{
  background:#173b70;
  color:white;
  padding:18px;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:16px;
}
.card{
  background:white;
  padding:18px;
  margin:16px 0;
  border-radius:10px;
  box-shadow:0 2px 8px #0001;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}
button{
  background:#173b70;
  color:white;
  border:0;
  padding:11px 17px;
  border-radius:6px;
  cursor:pointer;
}
button:disabled{opacity:.5}
.stats{
  font-size:22px;
  font-weight:bold;
  color:#173b70;
}
.table-wrap{overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}
th,td{
  padding:12px;
  border-bottom:1px solid #ddd;
  text-align:left;
  font-size:14px;
}
th{
  background:#edf2fa;
  color:#173b70;
}
.message{
  padding:12px;
  color:#555;
}
footer{
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <h2>JoinBuddy Admin</h2>
  <p>Google Sheet Lead Management</p>
</header>

<div class="container">

  <div class="card">
    <div class="top">
      <div>
        <h3>📋 All Leads</h3>
        <p>Google Sheet से Sync हुई सभी Leads</p>
      </div>
      <button id="refreshButton" onclick="loadLeads()">
        Refresh Leads
      </button>
    </div>

    <p>Total Leads: <span class="stats" id="totalLeads">0</span></p>
    <p id="message" class="message">Loading Leads...</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Lead Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>City</th>
            <th>Source</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="leadTable">
        </tbody>
      </table>
    </div>
  </div>

  <footer>
    <button onclick="location.href='admin-panel.html'">
      Back to Admin Panel
    </button>
  </footer>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const client = window.supabaseClient;

async function initialize(){

  if(!client){
    document.getElementById("message").textContent =
      "Supabase connection failed.";
    return;
  }

  const {data:{user},error} = await client.auth.getUser();

  if(error || !user){
    location.href="admin-panel.html";
    return;
  }

  const {data:profile,error:profileError} = await client
    .from("partner_profiles")
    .select("role,status")
    .eq("id",user.id)
    .single();

  if(profileError || !profile ||
     profile.role !== "admin" ||
     profile.status !== "approved"){

    alert("Admin access required");
    location.href="admin-panel.html";
    return;
  }

  await loadLeads();
}

async function loadLeads(){

  const button = document.getElementById("refreshButton");
  const message = document.getElementById("message");
  const table = document.getElementById("leadTable");

  button.disabled = true;
  message.textContent = "Loading Leads...";
  table.innerHTML = "";

  const {data,error} = await client
    .from("leads")
    .select("id,lead_name,phone,email,city,source,notes")
    .order("id",{ascending:false});

  if(error){
    message.textContent = "Error: " + error.message;
    button.disabled = false;
    return;
  }

  document.getElementById("totalLeads").textContent =
    data ? data.length : 0;

  if(!data || data.length === 0){
    message.textContent = "No Leads Found.";
    button.disabled = false;
    return;
  }

  message.textContent = "Leads Successfully Loaded.";

  data.forEach(lead => {

    const row = document.createElement("tr");

    const fields = [
      lead.lead_name,
      lead.phone,
      lead.email,
      lead.city,
      lead.source,
      lead.notes
    ];

    fields.forEach(value => {
      const cell = document.createElement("td");
      cell.textContent = value || "-";
      row.appendChild(cell);
    });

    table.appendChild(row);
  });

  button.disabled = false;
}

initialize().catch(error => {
  document.getElementById("message").textContent =
    "Error: " + error.message;
});
</script>

</body>
</html>
