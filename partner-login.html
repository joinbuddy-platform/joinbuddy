
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Login - JoinBuddy</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      line-height: 1.7;
    }
    header {
      background: #172554;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }
    nav {
      background: white;
      padding: 12px;
      text-align: center;
    }
    nav a {
      margin: 7px;
      color: #172554;
      text-decoration: none;
      font-weight: bold;
    }
    main {
      max-width: 420px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0 16px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      background: #172554;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #172554;
      color: white;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <h1>Partner Login</h1>
  <p>JoinBuddy - Work Together. Grow Together.</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
  <a href="partner-registration.html">Register</a>
</nav>

<main>
  <h2>Welcome Back!</h2>
  <p>Login to your Partner Account.</p>

  <form id="loginForm">
    <label for="partnerId">Partner ID</label>
    <input type="text" id="partnerId" placeholder="Example: JB1001" required>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password" required>

    <button type="submit">Login</button>
  </form>

  <p style="text-align:center;">
    New Partner? <a href="partner-registration.html">Register Here</a>
  </p>
</main>

<footer>
  <p>© 2026 JoinBuddy. All Rights Reserved.</p>
</footer>

<script>
  document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();
    alert("Login system will be connected to the secure database in the next steps.");
  });

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<p id="connectionStatus">Checking connection...</p>

<script>
  const status = document.getElementById("connectionStatus");

  if (window.supabaseClient) {
    status.innerText = "Supabase Connected Successfully";
    status.style.color = "green";
  } else {
    status.innerText = "Connection Failed. Please check configuration.";
    status.style.color = "red";
  }
</script>


</body>
</html>
