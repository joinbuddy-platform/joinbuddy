
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoinBuddy Partner Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      margin: 0;
      padding: 25px;
    }
    .login-box {
      max-width: 380px;
      margin: 55px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #0002;
    }
    h2 { text-align: center; color: #173b70; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      box-sizing: border-box;
      border-radius: 6px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #173b70;
      color: white;
      border: 0;
      cursor: pointer;
    }
    #message { margin-top: 15px; text-align: center; }
  </style>
</head>
<body>

<div class="login-box">
  <h2>JoinBuddy Partner Login</h2>
  <p>अपनी Partner ID और Password डालें।</p>

  <form id="loginForm">
    <input id="partnerId" type="text"
      placeholder="Partner ID (जैसे JB1001)" required>

    <input id="password" type="password"
      placeholder="Password" required>

    <button id="loginButton" type="submit">Login</button>
  </form>

  <p id="message"></p>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const client = window.supabaseClient;

document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const partnerId = document.getElementById("partnerId")
    .value.trim().toUpperCase();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");
  const button = document.getElementById("loginButton");

  if (!/^JB[0-9]{3,10}$/.test(partnerId)) {
    message.textContent = "सही Partner ID डालें। उदाहरण: JB1001";
    message.style.color = "red";
    return;
  }

  button.disabled = true;
  button.textContent = "Please wait...";
  message.textContent = "";

  try {
    const internalEmail =
      partnerId.toLowerCase() + "@partners.joinbuddy.invalid";

    const { data, error } = await client.auth.signInWithPassword({
      email: internalEmail,
      password: password
    });

    if (error) throw error;

    const { data: profile, error: profileError } = await client
      .from("partner_profiles")
      .select("partner_id, role, status, full_name")
      .eq("id", data.user.id)
      .single();

    if (profileError || !profile ||
        profile.partner_id !== partnerId ||
        profile.role !== "partner" ||
        profile.status !== "approved") {
      await client.auth.signOut();
      throw new Error("Partner account approved नहीं है या जानकारी गलत है।");
    }

    message.style.color = "green";
    message.textContent = "Login Successful! Welcome " + profile.full_name;

  } catch (error) {
    message.style.color = "red";
    message.textContent = error.message || "Login failed.";
  } finally {
    button.disabled = false;
    button.textContent = "Login";
  }
});
</script>

</body>
</html>
